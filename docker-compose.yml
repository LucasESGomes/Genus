# Compose principal do Genus: sobe o projeto inteiro com um comando.
#
#   pnpm setup:dev            # só na primeira vez: cria o .env (senhas geradas) e os .env.dev dos apps
#   docker compose up -d      # tudo
#   docker compose ps         # estado e saúde de cada contêiner
#
# O que sobe (cada peça tem o próprio docker-compose.yml de entrada e um service.compose.yml com a definição):
#   db/                        postgres (arp + app) → db-roles → arp-migrate
#   packages/queue/            valkey (fila BullMQ)
#   services/face-engine/      face-engine
#   apps/rep-core/             rep-core (NSR)
#   apps/jobs/                 jobs (resgate)
#   apps/collector-api/        api do coletor (inclui db, valkey, engine, rep-core e jobs)
#   apps/api/                  api do portal de RH (inclui db) → rh-migrate
#
# Para subir só uma parte, entre na pasta dela e rode `docker compose up`.
# O Compose deduplica o que várias partes incluem (um Postgres, um Valkey, uma engine).
#
# Prioridade de recursos: banco e engine têm a maior fatia de CPU em disputa (cpu_shares 2048),
# memória reservada e oom_score_adj negativo; Valkey, rep-core, apis vêm depois; jobs por último.
name: genus

# Cada service.compose.yml entra UMA vez. Incluir as entradas dos apps (apps/*/docker-compose.yml)
# traria db/ duas vezes (coletor e api), e o Compose 5.x funde as cópias e recusa listas
# duplicadas ("security_opt items at 0 and 1 are equal"). As entradas por pasta continuam valendo
# para subir uma parte isolada.
include:
  - path: db/service.compose.yml
    env_file: .env
  - path: packages/queue/service.compose.yml
    env_file: .env
  - path: services/face-engine/service.compose.yml
    env_file: .env
  - path: apps/rep-core/service.compose.yml
    env_file: .env
  - path: apps/jobs/service.compose.yml
    env_file: .env
  - path: apps/collector-api/service.compose.yml
    env_file: .env
  - path: apps/api/service.compose.yml
    env_file: .env
  - path: apps/portal/service.compose.yml
    env_file: .env
