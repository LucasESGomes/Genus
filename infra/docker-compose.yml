# Infraestrutura local e de homologação do Genus (Compose v2).
# Uso: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
# O perfil "dev" publica a porta da engine e a do Valkey em 127.0.0.1. Sem ele, ficam só na rede interna.
name: genus

services:
  # Um único Postgres com os DOIS bancos lógicos: `arp` (fiscal, REP-P: batidas, NSR)
  # e `app` (operacional: portais de RH). Eles se separam por banco e por papel
  # (arp_owner, arp_collector, arp_core, arp_reader), não por container (02-arquitetura.md §4.5, Tier 1).
  postgres:
    image: postgres:17.6-alpine
    container_name: genus-postgres-arp-app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER em infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em infra/.env}
      # Senhas dos papéis do banco arp: o init (primeira subida do volume) e o garantir-papeis.sh (dev-up) as leem.
      ARP_OWNER_PASSWORD: ${ARP_OWNER_PASSWORD:?Defina ARP_OWNER_PASSWORD em infra/.env}
      ARP_COLLECTOR_PASSWORD: ${ARP_COLLECTOR_PASSWORD:?Defina ARP_COLLECTOR_PASSWORD em infra/.env}
      ARP_CORE_PASSWORD: ${ARP_CORE_PASSWORD:?Defina ARP_CORE_PASSWORD em infra/.env}
      ARP_READER_PASSWORD: ${ARP_READER_PASSWORD:?Defina ARP_READER_PASSWORD em infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  face-engine:
    build: ../services/face-engine
    image: genus-face-engine
    container_name: genus-face-engine
    restart: unless-stopped
    environment:
      MASTER_KEY: ${MASTER_KEY:?Defina MASTER_KEY (64 hex) em infra/.env}
      ENGINE_API_KEY: ${ENGINE_API_KEY:?Defina ENGINE_API_KEY em infra/.env}
      # Nunca true fora de benchmark.
      BENCH_ENDPOINTS: "false"
      SAVE_AUDIT_FRAMES: "false"
      # 1 vCPU por engine: sem paralelismo interno.
      ENGINE_THREAD_POOL_SIZE: "1"
      ONNX_INTRA_OP_THREADS: "1"
      CV2_NUM_THREADS: "1"
    cpus: 1.0
    volumes:
      - engine-models:/app/models
      - insightface:/root/.insightface
    # Sem "ports": a engine só é alcançada pela rede interna do Compose.
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8001/health')).get('status')=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # A primeira subida baixa os modelos ONNX; tempo de tolerância maior.
      start_period: 300s

  # Só no perfil "dev": publica a porta da engine em 127.0.0.1 para testes locais.
  # Subir com: docker compose -f infra/docker-compose.yml --profile dev up -d
  face-engine-port:
    image: alpine/socat:1.8.0.3
    container_name: genus-face-engine-porta-dev
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8001}:8001"
    command: tcp-listen:8001,fork,reuseaddr tcp-connect:face-engine:8001
    depends_on:
      - face-engine

  # Valkey: fila das batidas (BullMQ). Versão exata, nunca `latest`.
  # Sem "ports": só a rede interna do Compose alcança o Valkey (o acesso do host é o perfil dev, abaixo).
  valkey:
    image: valkey/valkey:9.2.0-alpine
    container_name: genus-valkey
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Defina VALKEY_PASSWORD em infra/.env}
    # AOF a cada segundo e noeviction: com a memória cheia o Valkey recusa escrita, não descarta batida na fila.
    # A senha entra por variável de ambiente, lida pelo shell do contêiner ($$ é o $ escapado do Compose).
    command: sh -c 'exec valkey-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$VALKEY_PASSWORD"'
    volumes:
      - valkey-dados:/data
    healthcheck:
      # A senha vai por REDISCLI_AUTH (variável de ambiente), nunca na linha de comando do valkey-cli.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Só no perfil "dev": publica o Valkey em 127.0.0.1 para testes locais.
  # Sem o perfil, o Valkey não tem porta no host.
  valkey-porta-dev:
    image: alpine/socat:1.8.0.3
    container_name: genus-valkey-porta-dev
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    command: tcp-listen:6379,fork,reuseaddr tcp-connect:valkey:6379
    depends_on:
      - valkey

volumes:
  # Nomes fixos, para ficar claro no `docker volume ls`.
  pgdata:
    name: genus-postgres-arp-app-dados
  engine-models:
    name: genus-face-engine-modelos
  insightface:
    name: genus-face-engine-insightface
  valkey-dados:
    name: genus-valkey-dados
