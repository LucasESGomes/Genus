$kind: http-request
description: "`capturedAt` fora do formato ISO 8601: 400 `VALIDATION_ERROR`."
url: "{{baseUrl}}/coletor/batidas"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: image
      src: 'postman/fixtures/synthetic.png'
    - type: text
      key: deviceSequence
      value: "{{deviceSequence}}"
    - type: text
      key: capturedAt
      value: ontem de manha
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      const schema = {"type":"object","required":["error","code"],"properties":{"error":{"type":"string","minLength":1},"code":{"const":"VALIDATION_ERROR"},"details":{"type":"array","items":{"type":"object","required":["path","message"]}}}};
      pm.test('Corpo respeita o JSON Schema', () => pm.response.to.have.jsonSchema(schema));
      pm.test('details aponta capturedAt', () => pm.expect(JSON.stringify(pm.response.json().details || [])).to.include('capturedAt'));
    language: text/javascript
examples: ./.resources/capturedAt inválido.resources/examples
order: 5000
