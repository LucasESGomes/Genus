$kind: http-request
description: "Arquivo de texto enviado como `image/png`: o mime declarado não bate com os magic bytes. 400 `INVALID_IMAGE`."
url: "{{baseUrl}}/coletor/batidas"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: image
      src: 'postman/fixtures/not-an-image.png'
    - type: text
      key: deviceSequence
      value: "{{deviceSequence}}"
    - type: text
      key: capturedAt
      value: "{{capturedAt}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      const schema = {"type":"object","required":["error","code"],"properties":{"error":{"type":"string","minLength":1},"code":{"const":"INVALID_IMAGE"},"details":{"type":"array","items":{"type":"object","required":["path","message"]}}}};
      pm.test('Corpo respeita o JSON Schema', () => pm.response.to.have.jsonSchema(schema));
    language: text/javascript
examples: ./.resources/Imagem inválida (magic bytes).resources/examples
order: 1000
