$kind: http-request
name: 2. Criar feriado da conta
description: "Municipal: usa a UF e o município do estabelecimento."
url: "{{portalUrl}}/portal/holidays"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "establishmentId": {{establishmentId}}, "date": "{{year}}-08-15", "name": "Feriado municipal Postman", "scope": "municipal" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 ou 409 (já existe)', () => pm.expect([201, 409]).to.include(pm.response.code));
      if (pm.response.code === 201) pm.collectionVariables.set('ownHolidayId', pm.response.json().data.id);
    language: text/javascript
order: 2000
