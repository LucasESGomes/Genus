$kind: http-request
name: 8. Criar troca de turno
description: "Folga pontual num dia (RF12). Muda só o previsto."
url: "{{portalUrl}}/portal/employees/{{employeeId}}/schedule-overrides"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "date": "{{to}}", "isDayOff": true, "reason": "Troca combinada com o colega" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 ou 409 (já existe no dia)', () => pm.expect([201, 409]).to.include(pm.response.code));
      if (pm.response.code === 201) pm.collectionVariables.set('overrideId', pm.response.json().data.id);
    language: text/javascript
order: 8000
