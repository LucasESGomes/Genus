$kind: http-request
name: 1. Desativar escala
description: "Inativa não recebe vínculo novo. Só rh."
url: "{{portalUrl}}/portal/schedules/{{scheduleId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "isActive": false }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Inativa', () => pm.expect(pm.response.json().data.isActive).to.eql(false));
    language: text/javascript
order: 1000
