$kind: http-request
name: 3. Alterar setor
description: "Nome e limite de férias simultâneas."
url: "{{portalUrl}}/portal/departments/{{departmentId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "maxSimultaneousVacations": 3 }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Limite alterado', () => pm.expect(pm.response.json().data.maxSimultaneousVacations).to.eql(3));
    language: text/javascript
order: 3000
