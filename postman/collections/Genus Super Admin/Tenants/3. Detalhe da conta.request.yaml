$kind: http-request
name: 3. Detalhe da conta
description: "GET /portal/super-admin/tenants/:tenantId. Empresas, usuários administradores (sem colaborador_id) e `hasCompanyKey`. Nenhum CPF, nome de colaborador ou batida."
url: "{{portalUrl}}/portal/super-admin/tenants/{{tenantId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Id da conta criada', () => pm.expect(String(d.id)).to.eql(pm.collectionVariables.get('tenantId')));
      pm.test('Empresa com o CNPJ enviado, sem pontuação', () => pm.expect(d.companies.map((c) => c.cnpj)).to.include(pm.collectionVariables.get('tenantCnpj')));
      pm.test('Admin listado sem colaborador_id, só campos do contrato', () => {
        const admin = d.admins.find((a) => String(a.id) === pm.collectionVariables.get('adminUserId'));
        pm.expect(admin).to.be.an('object');
        pm.expect(Object.keys(admin).sort()).to.eql(['email', 'id', 'isActive', 'mfaEnabled', 'name', 'role'].sort());
      });
      pm.test('hasCompanyKey é booleano', () => pm.expect(d.hasCompanyKey).to.be.a('boolean'));
    language: text/javascript
order: 3000
