$kind: collection
description: |-
  Contas (tenants) da plataforma: criar (com empresa, estabelecimento e admin), listar, detalhar, renomear, suspender e reativar. Cada escrita é auditada (`tenant` criacao/alteracao, `tenant_admin` criacao).
  Ordem importa: a criação preenche `tenantId` e `adminUserId`; suspender e reativar usam a mesma conta.
order: 1000
