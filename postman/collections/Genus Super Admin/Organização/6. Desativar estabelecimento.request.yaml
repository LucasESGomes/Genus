$kind: http-request
name: 6. Desativar estabelecimento
description: "PATCH /establishments/:establishmentId com campos parciais e `isActive`. Mudar tipo ou inscrição com colaborador: `REGISTRO_EM_USO` (409). Desativar não afeta batidas."
url: "{{portalUrl}}/portal/super-admin/tenants/{{tenantId}}/establishments/{{establishmentId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "isActive": false }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Estabelecimento inativo', () => pm.expect(pm.response.json().data.isActive).to.eql(false));
    language: text/javascript
order: 6000
