$kind: http-request
name: 3. Listar empresas
description: "GET /companies: empresas da conta, cada uma com os estabelecimentos."
url: "{{portalUrl}}/portal/super-admin/tenants/{{tenantId}}/companies"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const empresa = pm.response.json().data.find((c) => String(c.id) === pm.collectionVariables.get('companyId'));
      pm.test('Empresa criada aparece com o estabelecimento', () => {
        pm.expect(empresa).to.exist;
        pm.expect(empresa.establishments.map((e) => String(e.id))).to.include(pm.collectionVariables.get('establishmentId'));
      });
    language: text/javascript
order: 3000
