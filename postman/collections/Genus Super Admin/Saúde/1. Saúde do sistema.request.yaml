$kind: http-request
name: 1. Saúde do sistema
description: "GET /portal/super-admin/system-health. `status` geral e um check por serviço (`ok` | `degraded` | `down`), com `latencyMs` (null se não configurado), `detail` em pt-BR e `metrics` só numéricas."
url: "{{portalUrl}}/portal/super-admin/system-health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Campos do contrato', () => pm.expect(Object.keys(d).sort()).to.eql(['checkedAt', 'checks', 'status', 'uptimeSeconds', 'version'].sort()));
      pm.test('Status geral conhecido', () => pm.expect(d.status).to.be.oneOf(['ok', 'degraded', 'down']));
      const SERVICOS = ['api', 'postgres_app', 'postgres_arp', 'valkey', 'face_engine', 'collector_api', 'rep_core', 'jobs'];
      d.checks.forEach((c) => {
        pm.test('Check ' + c.service + ' com campos do contrato e sem URL ou exceção', () => {
          pm.expect(SERVICOS).to.include(c.service);
          pm.expect(c.status).to.be.oneOf(['ok', 'degraded', 'down']);
          pm.expect(Object.keys(c).sort()).to.eql(['detail', 'latencyMs', 'metrics', 'service', 'status'].sort());
          pm.expect(c.latencyMs === null || typeof c.latencyMs === 'number').to.eql(true);
          if (c.detail !== null) pm.expect(c.detail).to.not.match(/https?:\/\/|postgres:\/\/|redis:\/\//i);
          if (c.metrics !== null) Object.values(c.metrics).forEach((v) => pm.expect(v).to.be.a('number'));
        });
      });
    language: text/javascript
order: 1000
