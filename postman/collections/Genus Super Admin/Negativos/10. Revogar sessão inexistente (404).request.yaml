$kind: http-request
name: 10. Revogar sessão inexistente (404)
description: "POST /access/sessions/:sessionId/revoke com id que não existe: 404 `NOT_FOUND`."
url: "{{portalUrl}}/portal/super-admin/access/sessions/999999999/revoke"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "reason": "Teste Postman: sessão inexistente" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Código NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 10000
