$kind: http-request
name: 1. Sem sessão (401)
description: "Sem cookie e sem `Authorization`: 401 `UNAUTHORIZED`, antes de qualquer rota do painel."
url: "{{portalUrl}}/portal/super-admin/tenants"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Código UNAUTHORIZED', () => pm.expect(pm.response.json().code).to.eql('UNAUTHORIZED'));
    language: text/javascript
order: 1000
