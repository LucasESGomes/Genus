$kind: http-request
name: 1. Visão geral
description: "GET /portal/super-admin/stats/overview?window=. Contas (total, ativas, suspensas), colaboradores, aparelhos, usuários, batidas por dia, `processedRate` (0 a 1, ou null sem batidas), fechamentos pendentes, uso dos módulos e top contas (nome e contagens)."
url: "{{portalUrl}}/portal/super-admin/stats/overview?window=30d"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Contas: total = ativas + suspensas', () => pm.expect(d.tenants.total).to.eql(d.tenants.active + d.tenants.suspended));
      pm.test('processedRate é null ou fração 0 a 1', () => pm.expect(d.processedRate === null || (d.processedRate >= 0 && d.processedRate <= 1)).to.eql(true));
      pm.test('Batidas por dia com dia e contagem', () => d.punchesPerDay.forEach((p) => pm.expect(p).to.include.keys('day', 'punches')));
      pm.test('Uso dos módulos com os cinco contadores', () => pm.expect(d.moduleUsage).to.include.keys('adjustments', 'certificates', 'vacations', 'absences', 'closings'));
      pm.test('Top contas sem dados pessoais', () => d.topTenants.forEach((t) => pm.expect(Object.keys(t).sort()).to.eql(['employees', 'name', 'punches', 'tenantId'].sort())));
    language: text/javascript
order: 1000
