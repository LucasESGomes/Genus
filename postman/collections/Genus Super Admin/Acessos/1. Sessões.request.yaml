$kind: http-request
name: 1. Sessões
description: "GET /portal/super-admin/access/sessions. Filtros: `tenantId`, `userId`, `ip`, `active` (true | false), `page`, `pageSize`. Mostra e-mail do usuário do portal (não de colaborador) e IP. Responde `{ data, meta }`."
url: "{{portalUrl}}/portal/super-admin/access/sessions?tenantId={{tenantId}}&pageSize=20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Meta de paginação', () => pm.expect(b.meta).to.include.keys('page', 'pageSize', 'total'));
      pm.test('Sessões da conta filtrada', () => b.data.forEach((s) => pm.expect(String(s.tenantId)).to.eql(pm.collectionVariables.get('tenantId'))));
      pm.test('isActive é booleano e sessão tem papel', () => b.data.forEach((s) => { pm.expect(s.isActive).to.be.a('boolean'); pm.expect(s.role).to.be.a('string'); }));
      if (b.data.length) pm.collectionVariables.set('sessionId', String(b.data[0].id));
    language: text/javascript
order: 1000
