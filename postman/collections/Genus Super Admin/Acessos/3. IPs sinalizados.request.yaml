$kind: http-request
name: 3. IPs sinalizados
description: "GET /portal/super-admin/access/flagged-ips?window=24h. Agrega falhas por IP na janela. `reasons`: muitas_falhas, muitas_contas. Os limiares são [A CONFIRMAR]; sinalizar não bloqueia ninguém."
url: "{{portalUrl}}/portal/super-admin/access/flagged-ips?window=24h"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('data é lista', () => pm.expect(b.data).to.be.an('array'));
      b.data.forEach((ip) => {
        pm.test('IP com campos do contrato', () => pm.expect(Object.keys(ip).sort()).to.eql(['distinctAccounts', 'failures', 'firstSeenAt', 'flagged', 'ipAddress', 'lastSeenAt', 'reasons', 'successes'].sort()));
        pm.test('reasons só com códigos conhecidos; flagged coerente', () => {
          ip.reasons.forEach((r) => pm.expect(r).to.be.oneOf(['muitas_falhas', 'muitas_contas']));
          if (ip.flagged) pm.expect(ip.reasons).to.not.be.empty;
        });
      });
    language: text/javascript
order: 3000
