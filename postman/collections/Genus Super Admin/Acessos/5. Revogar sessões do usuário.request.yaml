$kind: http-request
name: 5. Revogar sessões do usuário
description: "POST /portal/super-admin/access/users/:userId/revoke-sessions com `{ reason }`. Derruba todas as sessões do usuário. O admin criado em `Tenants` nunca entrou, então o resultado esperado é `revoked: 0`. Grava `session` + `exclusao`."
url: "{{portalUrl}}/portal/super-admin/access/users/{{adminUserId}}/revoke-sessions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "reason": "Teste Postman: revogação em lote" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('revoked é zero para o admin novo (nunca entrou)', () => pm.expect(d.revoked).to.eql(0));
    language: text/javascript
order: 5000
