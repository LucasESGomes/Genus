$kind: http-request
name: 6. Extrato do colaborador
description: "Saldo e extrato."
url: "{{portalUrl}}/portal/employees/{{employeeId}}/time-bank"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Saldo e lançamentos', () => { const d = pm.response.json().data; pm.expect(d.balanceMinutes).to.be.a('number'); pm.expect(d.entries).to.be.an('array'); });
    language: text/javascript
order: 6000
