$kind: http-request
name: 5. Saldos do banco de horas
description: "Saldo, a vencer em 30 dias e próximo vencimento."
url: "{{portalUrl}}/portal/time-bank?establishmentId={{establishmentId}}&page=1&pageSize=25"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Lista paginada', () => { const b = pm.response.json(); pm.expect(b.data).to.be.an('array'); pm.expect(b.meta.total).to.be.a('number'); });
    language: text/javascript
order: 5000
