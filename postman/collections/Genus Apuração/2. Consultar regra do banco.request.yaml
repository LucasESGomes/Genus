$kind: http-request
name: 2. Consultar regra do banco
description: "Regra vigente ou próxima. rh e admin."
url: "{{portalUrl}}/portal/establishments/{{establishmentId}}/time-bank-policy"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
