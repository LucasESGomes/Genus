$kind: http-request
url: "{{portalUrl}}/portal/totem/context"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Código CHAVE_APARELHO_INVALIDA', () => pm.expect(pm.response.json().code).to.eql('CHAVE_APARELHO_INVALIDA'));
    language: text/javascript
order: 3000
