$kind: http-request
url: "{{portalUrl}}/portal/devices?establishmentId={{establishmentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Lista contém o aparelho criado', () => pm.expect(pm.response.json().data.map(d => String(d.id))).to.include(pm.collectionVariables.get('deviceId')));
    language: text/javascript
order: 2000
