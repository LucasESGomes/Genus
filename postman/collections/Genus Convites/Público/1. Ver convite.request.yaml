$kind: http-request
name: 1. Ver convite
description: "POST /portal/public/invites/preview com `{ token }`. Devolve conta, nome, e-mail mascarado, papel e prazo. Convite que não vale: 404 `CONVITE_INVALIDO`."
url: "{{portalUrl}}/portal/public/invites/preview"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "token": "{{inviteToken}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('E-mail mascarado', () => pm.expect(pm.response.json().data.emailMasked).to.include('***@'));
    language: text/javascript
order: 1000
