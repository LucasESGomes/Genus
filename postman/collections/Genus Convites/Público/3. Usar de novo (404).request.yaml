$kind: http-request
name: 3. Usar de novo (404)
description: "O mesmo convite depois do aceite: 404 `CONVITE_INVALIDO`."
url: "{{portalUrl}}/portal/public/invites/preview"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "token": "{{inviteToken}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('CONVITE_INVALIDO', () => pm.expect(pm.response.json().code).to.eql('CONVITE_INVALIDO'));
    language: text/javascript
order: 3000
