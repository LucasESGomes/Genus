name: Genus Coletor · homolog
values:
  - key: baseUrl
    value: 'https://coletor.homolog.genus.example'
    enabled: true
    type: default
    description: 'Placeholder: ajuste para a URL real da homologação.'
  - key: serviceKey
    value: ''
    enabled: true
    type: secret
    description: 'Chave de serviço (header X-Service-Key): uma das COLLECTOR_SERVICE_KEYS. Preencha só o valor atual no Postman; nunca versionar.'
  - key: maxResponseMs
    value: '1500'
    enabled: true
    type: default
    description: Teto (ms) do teste de tempo de resposta.
  - key: stubControlUrl
    value: ''
    enabled: true
    type: default
    description: Só no runner local (pnpm postman:test, stub da engine). Deixe vazio com a engine real.
  - key: portalUrl
    value: 'https://rh-homolog.genus.example'
    enabled: true
    type: default
    description: 'api do RH (apps/api), para a coleção Super Admin. Placeholder: ajuste para a URL real de homologação.'
  - key: superAdminToken
    value: ''
    enabled: true
    type: secret
    description: 'JWT do super_admin (GET /auth/token, depois de entrar no portal com 2FA). Preencha só o valor atual no Postman; nunca versionar.'
  - key: clientToken
    value: ''
    enabled: true
    type: secret
    description: 'JWT de um usuário rh ou admin de qualquer conta, só para os testes 403 da coleção Super Admin. Nunca versionar.'
